<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Inscription – Vite & Gourmand</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
  <div class="nav-logo">🍽️ Vite & Gourmand</div>
  <ul class="nav-links">
    <li><a href="index.html">Accueil</a></li>
    <li><a href="menus.html">Nos menus</a></li>
    <li><a href="contact.html">Contact</a></li>
    <li><a href="login.html" class="btn-connexion">Connexion</a></li>
  </ul>
</nav>
<section class="auth-section">
  <div class="auth-container">
    <div class="auth-box">
      <h2>Créer un compte</h2>
      <div id="msg-erreur" style="color:red;display:none;margin-bottom:10px"></div>
      <div id="msg-succes" style="color:green;display:none;margin-bottom:10px"></div>
      <div class="form-group"><label>Nom</label><input type="text" id="nom"></div>
      <div class="form-group"><label>Prénom</label><input type="text" id="prenom"></div>
      <div class="form-group"><label>Email</label><input type="email" id="email"></div>
      <div class="form-group"><label>Téléphone</label><input type="text" id="telephone"></div>
      <div class="form-group"><label>Adresse postale</label><input type="text" id="adresse"></div>
      <div class="form-group"><label>Mot de passe</label><input type="password" id="mdp">
        <small>10 caractères min, 1 majuscule, 1 minuscule, 1 chiffre, 1 caractère spécial</small>
      </div>
      <button class="btn-primary btn-full" onclick="sInscrire()">Créer mon compte</button>
      <p class="switch-auth">Déjà un compte ? <a href="login.html">Se connecter</a></p>
    </div>
  </div>
</section>
<script>
function sInscrire() {
  const nom = document.getElementById('nom').value.trim();
  const prenom = document.getElementById('prenom').value.trim();
  const email = document.getElementById('email').value.trim();
  const telephone = document.getElementById('telephone').value.trim();
  const adresse = document.getElementById('adresse').value.trim();
  const mdp = document.getElementById('mdp').value.trim();
  const erreur = document.getElementById('msg-erreur');
  const succes = document.getElementById('msg-succes');
  erreur.style.display = 'none';
  const regexMdp = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{10,}$/;
  if (!nom || !prenom || !email || !telephone || !adresse || !mdp) {
    erreur.textContent = 'Veuillez remplir tous les champs.';
    erreur.style.display = 'block'; return;
  }
  if (!regexMdp.test(mdp)) {
    erreur.textContent = 'Mot de passe invalide : 10 caractères min, 1 majuscule, 1 minuscule, 1 chiffre, 1 caractère spécial.';
    erreur.style.display = 'block'; return;
  }
  const user = {nom, prenom, email, telephone, adresse, role: 'utilisateur'};
  localStorage.setItem('user', JSON.stringify(user));
  succes.textContent = 'Compte créé ! Un email de bienvenue vous a été envoyé. Redirection...';
  succes.style.display = 'block';
  setTimeout(() => window.location.href = 'index.html', 2000);
}
</script>
</body>
</html>
